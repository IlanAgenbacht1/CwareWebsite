        - heading "Who it is for" [level=2] [ref=f1e32]
        - paragraph [ref=f1e33]: Businesses that need to manage customer onboarding, enquiries, notifications or follow-ups on WhatsApp.
      - article [ref=f1e34]:
        - heading "The problem it solves" [level=2] [ref=f1e35]
        - paragraph [ref=f1e36]: Staff repeat the same replies and manually transfer information from conversations into business systems.
      - article [ref=f1e37]:
        - heading "Integrations" [level=2] [ref=f1e38]
        - paragraph [ref=f1e39]: CRM, ERP and database integrations are scoped against the available APIs, permissions and required workflows. Support for a particular system is confirmed during discovery.
      - article [ref=f1e40]:
        - heading "Relevant teams and industries" [level=2] [ref=f1e41]
        - paragraph [ref=f1e42]: Customer-facing businesses with repeatable sales, onboarding or service processes.
    - generic [ref=f1e43]:
      - paragraph [ref=f1e44]: CAPABILITIES
      - heading "What the work includes." [level=2] [ref=f1e45]
      - generic [ref=f1e46]:
        - article [ref=f1e47]:
          - text: "01"
          - heading "Capture and onboard in chat" [level=3] [ref=f1e48]
          - paragraph [ref=f1e49]: Guide customers through questions and capture the answers directly in your CRM or database. Turn an enquiry into a qualified lead or an onboarded customer without retyping the conversation.
        - article [ref=f1e50]:
          - text: "02"
          - heading "Automate routine support" [level=3] [ref=f1e51]
          - paragraph [ref=f1e52]: Handle recurring questions about hours, pricing, order status and statements. Route the conversation to a person when it needs individual attention.
        - article [ref=f1e53]:
          - text: "03"
          - heading "Broadcast and notify" [level=3] [ref=f1e54]
          - paragraph [ref=f1e55]: Send targeted campaigns, order updates and account notifications. Support loyalty registrations and follow-ups through the channel your customers already use.
        - article [ref=f1e56]:
          - text: "04"
          - heading "Build customer journeys" [level=3] [ref=f1e57]
          - paragraph [ref=f1e58]: Set up multi-step onboarding, payment reminders and post-service feedback. Agreed rules drive each step so your team does not have to remember every follow-up.
